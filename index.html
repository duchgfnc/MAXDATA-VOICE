<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#15181c; --sub:#6b7280; --line:#e6e8ec;
  --accent:#0f766e; --accent-soft:#e6f4f1; --pill:#eef0f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(246,247,249,.92);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0 0 2px;font-size:18px;letter-spacing:.2px}
.sub{color:var(--sub);font-size:12.5px}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{font-weight:600;color:var(--sub);margin-left:4px;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{color:rgba(255,255,255,.75)}
main{padding:12px 16px 80px;max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s}
.card:hover{border-color:#cfd6dd;transform:translateY(-1px)}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.play{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--pill);
  display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:13px}
.card.on .play{background:var(--accent);color:#fff}
.meta{min-width:0;flex:1}
.name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{margin-top:3px;font-size:11.5px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--pill);border-radius:5px;padding:1px 5px}
.tag.tesla{background:#fdf1e3;color:#a4620d}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:9px 16px;font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center}
footer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
audio{display:none}
</style>
</head>

const CATS = [{"k": "网络热梗", "n": 103, "d": "短视频热梗、口头禅、搞笑段子"}, {"k": "动漫影视", "n": 25, "d": "蜡笔小新、皮卡丘、海绵宝宝、小猪佩奇等动画角色梗"}, {"k": "AI语音", "n": 22, "d": "AI 合成的提示语、贾维斯式播报、巡逻/哨兵口令"}, {"k": "游戏音效", "n": 18, "d": "超级玛丽、斗地主、吃鸡等游戏音"}, {"k": "动物自然", "n": 15, "d": "青蛙、鸟叫、虫鸣等自然拟声"}, {"k": "影视梗", "n": 11, "d": "影视台词、恐怖音效、皇上驾到等剧情梗"}, {"k": "机械车辆", "n": 11, "d": "引擎、气刹、电动车提示音等机械/车辆声"}, {"k": "系统数码", "n": 10, "d": "Windows 关机、开机音、提示音等系统声"}];
const CATNAME = {}; CATS.forEach(c => CATNAME[c.k] = c.d);
let curCat = "", curPlay = null;

const stat = document.getElementById('stat');
const total = DATA.length, locks = DATA.filter(d => d.c === 'lock').length;
stat.textContent = `锁车音效 ${locks} 条 · 车外喊话 ${total - locks} 条 · 点一下即听`;

const chips = document.getElementById('chips');
const mk = (label, n, key) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.key = key;
  b.innerHTML = `${label}<b>${n}</b>`;
  b.onclick = () => { curCat = key; paint(); };
  return b;
};
chips.appendChild(mk('全部', total, ''));
CATS.forEach(c => chips.appendChild(mk(c.k, c.n, c.k)));

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const au = document.getElementById('au');
const nowName = document.getElementById('nowName');
const nowTxt = document.getElementById('now');

function paint() {
  [...chips.children].forEach(b => b.classList.toggle('on', b.dataset.key === curCat));
  const kw = q.value.trim().toLowerCase();
  const rows = DATA.filter(d =>
    (!curCat || d.g === curCat) && (!kw || d.l.toLowerCase().includes(kw)));
  grid.innerHTML = '';
  document.getElementById('empty').hidden = rows.length > 0;
  const frag = document.createDocumentFragment();
  rows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'card'; el.dataset.id = d.i;
    const secs = (d.m / 1000).toFixed(d.m >= 10000 ? 0 : 1) + 's';
    const tags = [`<span class="tag">${d.g || (d.c === 'lock' ? '锁车' : '喊话')}</span>`];
    if (d.d) tags.push(`<span class="tag">↓${d.d}</span>`);
    if (d.t) tags.push('<span class="tag tesla">特斯拉直用</span>');
    el.innerHTML = `<div class="play">▶</div><div class="meta">
      <div class="name">${d.l}</div>
      <div class="tags"><span class="tag">${secs}</span>${tags.join('')}</div></div>`;
    el.onclick = () => play(d, el);
    frag.appendChild(el);
  });
  grid.appendChild(frag);
  markOn();
}

function markOn() {
  [...grid.children].forEach(el => {
    const on = curPlay && el.dataset.id === curPlay;
    el.classList.toggle('on', !!on);
    el.querySelector('.play').textContent = on ? '❚❚' : '▶';
  });
}

function play(d, el) {
  if (curPlay === d.i && !au.paused) { au.pause(); curPlay = null; markOn(); nowTxt.textContent = '未在播放'; nowName.textContent = ''; return; }
  curPlay = d.i;
  au.src = d.f;
  au.play().catch(e => { nowTxt.textContent = '无法播放（需在本目录内打开，或走 GitHub Pages）'; });
  nowTxt.textContent = '正在播放'; nowName.textContent = d.l;
  markOn();
}
au.onended = () => { curPlay = null; markOn(); nowTxt.textContent = '未在播放'; };
q.oninput = paint;
paint();
</script>
